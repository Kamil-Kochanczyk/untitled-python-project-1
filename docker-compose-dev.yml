name: untitled-python-project-1

services:

  postgres:
    container_name: postgres
    networks:
      untitled-python-project-1:
        aliases:
          - postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres-password
    secrets:
      - postgres-password
    volumes:
      - pgdata-untitled-python-project-1:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # should execute only once, when the volume is created
    image: postgres:18.6-alpine3.23@sha256:a0cbdbbcc57f7317ca183ac9d10eb3af72b5b05b2f25acad58e765bd2b139099
    shm_size: 128mb  # shared memory limit
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: pgadmin
    networks:
      untitled-python-project-1:
        aliases:
          - pgadmin
    ports:
      - 5433:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD_FILE=/run/secrets/pgadmin-password
    secrets:
      - pgadmin-password
    volumes:
      - pgadmindata-untitled-python-project-1:/var/lib/pgadmin
    image: dpage/pgadmin4:9@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    restart: unless-stopped
    depends_on:
      - postgres

networks:
  untitled-python-project-1:
    name: untitled-python-project-1

secrets:
  postgres-password:
    file: ./secrets/secret_postgres_pswd.txt
  pgadmin-password:
    file: ./secrets/secret_pgadmin_pswd.txt

volumes:
  pgdata-untitled-python-project-1:
    name: pgdata-untitled-python-project-1
  pgadmindata-untitled-python-project-1:
    name: pgadmindata-untitled-python-project-1
